---
# Deploy infrastruktur + test-miljø.
#
# Brug:
#   ansible-playbook ansible/deploy-test.yml -i ansible/inventory.yml --ask-vault-pass

- name: Deploy infrastruktur og test-miljø
  hosts: gihc_vps

  tasks:
    - name: Opret project-mappe på VPS
      ansible.builtin.file:
        path: "{{ project_dir }}"
        state: directory
        mode: "0755"

    - name: Sync project files
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../"
        dest: "{{ project_dir }}/"
        use_ssh_args: yes
        rsync_opts:
          - "--exclude=target"
          - "--exclude=.git"
          - "--exclude=.env"
          - "--exclude=ansible"
          - "--exclude=docker-compose.override.yml"

    - name: Skriv score.caddy til platform conf.d
      ansible.builtin.template:
        src: templates/score.caddy.j2
        dest: "{{ platform_dir }}/caddy/conf.d/score.caddy"
        mode: "0644"

    - name: Skriv .env fra vault
      ansible.builtin.template:
        src: templates/env.j2
        dest: "{{ project_dir }}/.env"
        mode: "0600"

    - name: Start postgres
      ansible.builtin.command:
        cmd: docker compose up -d postgres
        chdir: "{{ project_dir }}"

    - name: Vent på postgres
      ansible.builtin.command:
        cmd: docker compose exec -T postgres pg_isready -U {{ postgres_user }}
        chdir: "{{ project_dir }}"
      register: pg_ready
      retries: 12
      delay: 5
      until: pg_ready.rc == 0

    - name: Opret test- og beta-databaser (idempotent)
      ansible.builtin.command:
        cmd: >
          docker compose exec -T postgres
          psql -U {{ postgres_user }} -d postgres -c "CREATE DATABASE {{ item }}"
        chdir: "{{ project_dir }}"
      loop:
        - "{{ test_postgres_db }}"
        - "{{ beta_postgres_db }}"
      register: create_db
      failed_when: create_db.rc != 0 and 'already exists' not in (create_db.stderr | default(''))
      changed_when: create_db.rc == 0

    - name: Byg og start services
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
        chdir: "{{ project_dir }}"
      register: compose_result
      changed_when: "'Started' in compose_result.stdout or 'Created' in compose_result.stdout"

    - name: Vent på IPFS
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.yml exec -T ipfs ipfs id
        chdir: "{{ project_dir }}"
      register: ipfs_ready
      retries: 10
      delay: 5
      until: ipfs_ready.rc == 0

    # ── DNS A-records (idempotent) ─────────────────────────────────────────────

    - name: Hent DNS-records fra Simply.com
      ansible.builtin.uri:
        url: "https://api.simply.com/2/my/products/{{ domain }}/dns/records/"
        method: GET
        url_username: "{{ simply_account }}"
        url_password: "{{ simply_api_key }}"
        force_basic_auth: true
      register: simply_records

    - name: Opret A-records (hvis de mangler)
      ansible.builtin.uri:
        url: "https://api.simply.com/2/my/products/{{ domain }}/dns/records/"
        method: POST
        url_username: "{{ simply_account }}"
        url_password: "{{ simply_api_key }}"
        force_basic_auth: true
        body_format: json
        body:
          type: A
          name: "{{ item }}"
          data: "{{ vps_ip }}"
          ttl: 3600
        status_code: [200, 201]
      loop:
        - "score.api"
        - "beta.score.api"
        - "test.score.api"
        - "er-det-noget-vaerd.apps"
        - "beta.er-det-noget-vaerd.apps"
        - "test.er-det-noget-vaerd.apps"
      when: >-
        simply_records.json.records
        | selectattr('type', 'equalto', 'A')
        | selectattr('name', 'equalto', item)
        | list | length == 0

    - name: Genindlæs platform Caddy
      ansible.builtin.command:
        cmd: docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
        chdir: "{{ platform_dir }}"

    # ── Test-frontend via IPFS ─────────────────────────────────────────────────

    - name: Skriv test config.js
      ansible.builtin.template:
        src: templates/test-config.js.j2
        dest: "{{ project_dir }}/frontend/config.js"
        mode: "0644"

    - name: Tilføj test-frontend til IPFS
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.yml exec -T ipfs ipfs add -r /frontend/ -Q
        chdir: "{{ project_dir }}"
      register: test_ipfs_cid

    - name: Find eksisterende test _dnslink-record
      ansible.builtin.set_fact:
        test_dnslink_record: >-
          {{ simply_records.json.records
             | selectattr('type', 'equalto', 'TXT')
             | selectattr('name', 'search', '_dnslink\.' + test_frontend_domain | replace('.' + domain, ''))
             | list | first | default({}) }}

    - name: Opdatér test _dnslink TXT-record (eksisterende)
      ansible.builtin.uri:
        url: "https://api.simply.com/2/my/products/{{ domain }}/dns/records/{{ test_dnslink_record.record_id }}/"
        method: PUT
        url_username: "{{ simply_account }}"
        url_password: "{{ simply_api_key }}"
        force_basic_auth: true
        body_format: json
        body:
          type: TXT
          name: "_dnslink.{{ test_frontend_domain }}"
          data: "dnslink=/ipfs/{{ test_ipfs_cid.stdout | trim }}"
          ttl: 120
        status_code: [200]
      when: test_dnslink_record.record_id is defined

    - name: Opret test _dnslink TXT-record (ny)
      ansible.builtin.uri:
        url: "https://api.simply.com/2/my/products/{{ domain }}/dns/records/"
        method: POST
        url_username: "{{ simply_account }}"
        url_password: "{{ simply_api_key }}"
        force_basic_auth: true
        body_format: json
        body:
          type: TXT
          name: "_dnslink.{{ test_frontend_domain }}"
          data: "dnslink=/ipfs/{{ test_ipfs_cid.stdout | trim }}"
          ttl: 120
        status_code: [200, 201]
      when: test_dnslink_record.record_id is not defined

    - name: Vis test IPFS CID
      ansible.builtin.debug:
        msg: "Test CID: {{ test_ipfs_cid.stdout | trim }} — _dnslink.{{ test_frontend_domain }} opdateret"

    - name: Vent på test-API
      ansible.builtin.uri:
        url: "{{ test_base_url }}/auth/me"
        status_code: [401]
      register: test_api_ready
      retries: 24
      delay: 10
      until: test_api_ready.status == 401

    - name: Kør smoke tests mod test
      ansible.builtin.command:
        cmd: >
          bash {{ project_dir }}/scripts/smoke-test.sh
          {{ test_base_url }}
          {{ postgres_user }}
          {{ vault_postgres_password }}
          {{ test_postgres_db }}
          {{ project_dir }}
      changed_when: false
