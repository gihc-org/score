---
# Fremmer til beta + prod efter beståede smoke tests.
#
# Brug:
#   ansible-playbook ansible/deploy-promote.yml -i ansible/inventory.yml --ask-vault-pass

- name: Fremmer til beta og prod
  hosts: gihc_vps

  tasks:
    - name: Hent DNS-records fra Simply.com
      ansible.builtin.uri:
        url: "https://api.simply.com/2/my/products/{{ domain }}/dns/records/"
        method: GET
        url_username: "{{ simply_account }}"
        url_password: "{{ simply_api_key }}"
        force_basic_auth: true
      register: simply_records

    # ── Beta ──────────────────────────────────────────────────────────────────

    - name: Skriv beta config.js
      ansible.builtin.template:
        src: templates/beta-config.js.j2
        dest: "{{ project_dir }}/frontend/config.js"
        mode: "0644"

    - name: Tilføj beta-frontend til IPFS
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.yml exec -T ipfs ipfs add -r /frontend/ -Q
        chdir: "{{ project_dir }}"
      register: beta_ipfs_cid

    - name: Find eksisterende beta _dnslink-record
      ansible.builtin.set_fact:
        beta_dnslink_record: >-
          {{ simply_records.json.records
             | selectattr('type', 'equalto', 'TXT')
             | selectattr('name', 'search', '_dnslink\.' + beta_frontend_domain | replace('.' + domain, ''))
             | list | first | default({}) }}

    - name: Opdatér beta _dnslink TXT-record (eksisterende)
      ansible.builtin.uri:
        url: "https://api.simply.com/2/my/products/{{ domain }}/dns/records/{{ beta_dnslink_record.record_id }}/"
        method: PUT
        url_username: "{{ simply_account }}"
        url_password: "{{ simply_api_key }}"
        force_basic_auth: true
        body_format: json
        body:
          type: TXT
          name: "_dnslink.{{ beta_frontend_domain }}"
          data: "dnslink=/ipfs/{{ beta_ipfs_cid.stdout | trim }}"
          ttl: 120
        status_code: [200]
      when: beta_dnslink_record.record_id is defined

    - name: Opret beta _dnslink TXT-record (ny)
      ansible.builtin.uri:
        url: "https://api.simply.com/2/my/products/{{ domain }}/dns/records/"
        method: POST
        url_username: "{{ simply_account }}"
        url_password: "{{ simply_api_key }}"
        force_basic_auth: true
        body_format: json
        body:
          type: TXT
          name: "_dnslink.{{ beta_frontend_domain }}"
          data: "dnslink=/ipfs/{{ beta_ipfs_cid.stdout | trim }}"
          ttl: 120
        status_code: [200, 201]
      when: beta_dnslink_record.record_id is not defined

    - name: Vis beta IPFS CID
      ansible.builtin.debug:
        msg: "Beta CID: {{ beta_ipfs_cid.stdout | trim }} — _dnslink.{{ beta_frontend_domain }} opdateret"

    - name: Vent på beta-API
      ansible.builtin.uri:
        url: "{{ beta_base_url }}/auth/me"
        status_code: [401]
      register: beta_api_ready
      retries: 12
      delay: 5
      until: beta_api_ready.status == 401

    - name: Kør smoke tests mod beta
      ansible.builtin.command:
        cmd: >
          bash {{ project_dir }}/scripts/smoke-test.sh
          {{ beta_base_url }}
          {{ postgres_user }}
          {{ vault_postgres_password }}
          {{ beta_postgres_db }}
          {{ project_dir }}
      changed_when: false

    # ── Prod ──────────────────────────────────────────────────────────────────

    - name: Skriv prod config.js
      ansible.builtin.template:
        src: templates/config.js.j2
        dest: "{{ project_dir }}/frontend/config.js"
        mode: "0644"

    - name: Tilføj prod-frontend til IPFS
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.yml exec -T ipfs ipfs add -r /frontend/ -Q
        chdir: "{{ project_dir }}"
      register: ipfs_cid

    - name: Find eksisterende prod _dnslink-record
      ansible.builtin.set_fact:
        dnslink_record: >-
          {{ simply_records.json.records
             | selectattr('type', 'equalto', 'TXT')
             | selectattr('name', 'search', '_dnslink\.' + frontend_domain | replace('.' + domain, ''))
             | list | first | default({}) }}

    - name: Opdatér prod _dnslink TXT-record (eksisterende)
      ansible.builtin.uri:
        url: "https://api.simply.com/2/my/products/{{ domain }}/dns/records/{{ dnslink_record.record_id }}/"
        method: PUT
        url_username: "{{ simply_account }}"
        url_password: "{{ simply_api_key }}"
        force_basic_auth: true
        body_format: json
        body:
          type: TXT
          name: "_dnslink.{{ frontend_domain }}"
          data: "dnslink=/ipfs/{{ ipfs_cid.stdout | trim }}"
          ttl: 120
        status_code: [200]
      when: dnslink_record.record_id is defined

    - name: Opret prod _dnslink TXT-record (ny)
      ansible.builtin.uri:
        url: "https://api.simply.com/2/my/products/{{ domain }}/dns/records/"
        method: POST
        url_username: "{{ simply_account }}"
        url_password: "{{ simply_api_key }}"
        force_basic_auth: true
        body_format: json
        body:
          type: TXT
          name: "_dnslink.{{ frontend_domain }}"
          data: "dnslink=/ipfs/{{ ipfs_cid.stdout | trim }}"
          ttl: 120
        status_code: [200, 201]
      when: dnslink_record.record_id is not defined

    - name: Vis prod IPFS CID
      ansible.builtin.debug:
        msg: "Prod CID: {{ ipfs_cid.stdout | trim }} — _dnslink.{{ frontend_domain }} opdateret"

    - name: Vent på prod-API
      ansible.builtin.uri:
        url: "{{ base_url }}/auth/me"
        status_code: [401]
      register: api_ready
      retries: 12
      delay: 5
      until: api_ready.status == 401

    - name: Kør smoke tests mod prod
      ansible.builtin.command:
        cmd: >
          bash {{ project_dir }}/scripts/smoke-test.sh
          {{ base_url }}
          {{ postgres_user }}
          {{ vault_postgres_password }}
          {{ postgres_db }}
          {{ project_dir }}
      changed_when: false

    - name: Kør OWASP ZAP baseline scan
      ansible.builtin.command:
        cmd: >
          docker run --rm
          ghcr.io/zaproxy/zaproxy:stable
          zap-baseline.py -t {{ base_url }} -I
      register: zap_result
      changed_when: false
      failed_when: zap_result.rc > 1

    - name: Vis ZAP-resultat
      ansible.builtin.debug:
        msg: "{{ zap_result.stdout_lines[-10:] }}"
